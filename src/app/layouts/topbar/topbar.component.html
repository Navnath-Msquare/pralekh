<header id="page-topbar">
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <!-- LOGO -->
                <div class="navbar-brand-box horizontal-logo">
                    <a href="" class="logo logo-dark">
                        <span class="logo-sm">
                            <img src="assets/images/dashboard.png" alt="" height="22">
                        </span>
                        <span class="logo-lg">
                            <img src="assets/images/dashboard.png" alt="" height="17">
                        </span>
                    </a>

                    <a href="" class="logo logo-light">
                        <span class="logo-sm">
                            <img src="assets/images/dashboard.png" alt="" height="22">
                        </span>
                        <span class="logo-lg">
                            <img src="assets/images/dashboard.png" alt="" height="17">
                        </span>
                    </a>
                </div>

                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger" id="topnav-hamburger-icon" (click)="toggleMobileMenu($event)">
                    <span class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>

              
            </div>

            <div class="d-flex align-items-center">


                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                        data-toggle="fullscreen" (click)="fullscreen()">
                        <i class='bx bx-fullscreen fs-22'></i>
                    </button>
                </div>


                <div class="dropdown topbar-head-dropdown ms-1 header-item" ngbDropdown>
                    <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                        id="page-header-notifications-dropdown" data-bs-toggle="dropdown" aria-haspopup="true"
                        aria-expanded="false" ngbDropdownToggle >
                        <i class='bx bx-bell fs-22'></i>
                        <!-- <span
                            class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger" *ngIf="notificationCount != 0">{{notificationCount}}<span
                                class="visually-hidden">unread messages</span></span> -->
                    </button>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0"
                        aria-labelledby="page-header-notifications-dropdown"  ngbDropdownMenu>

                        <div class="dropdown-head bg-primary bg-pattern rounded-top">
                            <div class="p-3">
                                <div class="row align-items-center">
                                    <div class="col">
                                        <h6 class="m-0 fs-16 fw-semibold text-white"> Notifications </h6>
                                    </div>
                                    <div class="col-auto dropdown-tabs">
                                        <span class="badge badge-soft-light fs-13"> Clear</span>
                                    </div>
                                </div>
                            </div>

                             <div class="px-2 pt-2">
                                <ul ngbNav #nav="ngbNav" [activeId]="1" class="nav nav-tabs dropdown-tabs nav-tabs-custom" id="notificationItemsTab">
                                    <li [ngbNavItem]="1">
                                        <ng-template ngbNavContent>
                                            <div class="tab-pane fade show active py-2 ps-2" id="all-noti-tab" role="tabpanel">
                                                <ngx-simplebar style="max-height: 300px;">
                                                <div class="pe-2">

                                                    <!-- <div class="text-reset notification-item d-block dropdown-item position-relative" *ngFor="let item of notificationData;let i = index;">
                                                        <div class="d-flex">
                                                            <div class="flex-1">
                                                                <a class="stretched-link">
                                                                    <h6 class="mt-0 mb-2 lh-base">
                                                                        <span class="text-secondary" style="text-transform: capitalize;">{{item.title}}</span> <br>
                                                                        {{item.message}}
                                                                    </h6>
                                                                </a>
                                                                <p class="mb-0 fs-11 fw-medium text-uppercase text-muted">
                                                                    <span><i class="mdi mdi-clock-outline"></i> Just 30 sec ago</span>
                                                                </p>
                                                            </div>
                                                        </div>
                                                    </div> -->
                                                </div>
                                                </ngx-simplebar>
                                            </div>
                                        </ng-template>
                                    </li>
                                  </ul>
                            </div>

                        </div>

                        <div class="tab-content" id="notificationItemsTabContent">
                            <div class="tab-content text-muted">
                                <div [ngbNavOutlet]="nav"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="dropdown ms-sm-3 header-item topbar-user" ngbDropdown>
                    <button type="button" class="btn" id="page-header-user-dropdown" data-bs-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="false" ngbDropdownToggle>
                        <span class="d-flex align-items-center">
                            <img class="rounded-circle header-profile-user" onerror="this.src='assets/images/account.png'" src="{{baseURL}}retrieve/{{authService.currentUserValue.photo}}"
                                alt="Header Avatar">
                            <span class="text-start ms-xl-2">
                                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">{{name}}</span>
                                <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text" style="text-transform: capitalize;">{{role}}</span>
                            </span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end" style="transform:translate(235px, 60px);width: unset;" ngbDropdownMenu>
            
                        <a class="dropdown-item" *ngIf="role == 'admin'" [routerLink]="['/admin/settings']"><i
                                class="mdi mdi-account-circle text-muted fs-16 align-middle me-1"></i> <span
                                class="align-middle">Settings</span></a>
                        <a class="dropdown-item" href="javascript: void(0);" (click)="logout()"><i
                                class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i> <span
                                class="align-middle" data-key="t-logout">Logout</span></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
