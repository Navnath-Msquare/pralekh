<app-breadcrumbs title="{{ isEdit ? 'Edit Category' : 'Create Category' }}" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-body">
                <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
                    <div class="row gy-4">
                        <div class="col-xxl-6 col-md-6">
                            <div>
                                <label for="categoryName" class="form-label">Category Name</label>
                                <input type="text" class="form-control" id="categoryName" formControlName="name" placeholder="Enter category name">
                                <div *ngIf="categoryForm.get('name')?.invalid && (categoryForm.get('name')?.dirty || categoryForm.get('name')?.touched)" class="text-danger mt-1">
                                    <small *ngIf="categoryForm.get('name')?.errors?.['required']">Category Name is required.</small>
                                </div>
                            </div>
                        </div>

                        <div class="col-xxl-6 col-md-6">
                            <div>
                                <label for="categoryStatus" class="form-label">Category Status</label>
                                <select class="form-select" id="categoryStatus" formControlName="status">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-lg-12">
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary" [disabled]="categoryForm.invalid">Submit</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
