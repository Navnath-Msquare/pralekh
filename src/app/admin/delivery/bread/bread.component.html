<app-breadcrumbs title="{{label}}" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="card">
    <div class="card-header">
        <i class="ri-arrow-go-back-fill" style="cursor:pointer; margin-right: 10px;"
            [routerLink]="['/admin/distributors']"></i>
        <span class="card-title mb-0">{{label}}</span>
    </div><!-- end card header -->
    <div class="card-body">
        <div class="row">
            <div class="col-lg-12 border-right" >
                <div class="row">
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input [disabled]="action == 0" type="text" class="form-control" placeholder="Enter Name"
                                [(ngModel)]="name" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label class="form-label">Mobile</label>
                            <input [disabled]="action == 0" type="text" class="form-control"
                                placeholder="Enter Mobile" [(ngModel)]="mobile"
                                [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input [disabled]="action == 0" type="text" class="form-control" placeholder="Enter Email"
                                [(ngModel)]="email" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3" *ngIf="action != 1"></div>
                    <div class="col-lg-3" *ngIf="action == 1">
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Enter Password" [(ngModel)]="password"
                                [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input [disabled]="action == 0" type="text" class="form-control"
                                placeholder="Enter Address" [(ngModel)]="address" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label class="form-label">Region</label>
                            <input [disabled]="action == 0" type="text" class="form-control" placeholder="Enter Region"
                                [(ngModel)]="region" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer" *ngIf="action !== 0">
        <button type="button" style="float: right;" class="btn btn-primary waves-effect waves-light" (click)="submit()"
            [disabled]="loader">{{label}} <i class="fa fa-circle-o-notch fa-spin" *ngIf="loader"
                style="margin-left: 10px;"></i></button>
    </div>
</div>
