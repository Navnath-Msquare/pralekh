<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Subscriptions List" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row">
  <div class="col-lg-12">
      <div class="card"  id="tasksList">
          <div class="card-header border-0">
              <div class="d-flex align-items-center">
                  <h5 class="card-title mb-0 flex-grow-1">All Subscriptions</h5>
                  <div class="flex-shrink-0">
                      
                  </div>
              </div>
          </div>
          <div class="card-body bg-soft-light border border-dashed border-start-0 border-end-0">
            <form>
                <div class="row g-3">
                    <div class="col-xxl-5 col-sm-12">
                        <div class="search-box">
                            <input type="text"  name="searchTerm" class="form-control search bg-light border-light" placeholder="Search..." [(ngModel)]="searchTerm">
                            <i class="ri-search-line search-icon"></i>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-2 col-sm-6">
                        <div class="input-light">
                            <select class="form-control bg-light border-light" data-choices data-choices-search-false name="choices-single-default"  id="idStatus" [(ngModel)]="statusTerm">
                                <option value="" selected>All</option>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-xxl-5 col-sm-6 text-end">
                        <button class="btn btn-danger add-btn" [routerLink]="['/admin/plans/create']"><i class="ri-add-line align-bottom me-1"></i> Create Subscription</button>
                    </div>
                </div>
                <!--end row-->
            </form>
        </div>
        <div class="card-body"  style="padding-top: 0.6rem;">
              <div class="table-responsive table-card mb-2">
                <table class="table" #table>
                  <thead>
                  <tr class="bg-light text-muted">
                    <th scope="col" style="width: 10px;">
                      <div class="form-check">
                          <input class="form-check-input" type="checkbox" id="checkAll" value="option">
                      </div>
                  </th>
                  <th class="sort" sortable="taskId">ID</th>
                  <th class="sort" sortable="project">Name</th>
                  <th class="sort" sortable="project">Member Count</th>
                  <th class="sort" sortable="project">Partner Discount</th>
                  <th class="sort" sortable="task">Amount</th>
                  <th class="sort" sortable="creater">Details</th>
                  <th class="sort" sortable="subItem">Validity</th>
                  <th class="sort" sortable="subItem">Status</th>
                  <th class="sort" sortable="subItem">Action</th>
                  </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let data of data |filter:searchTerm | filter:statusTerm;let i =index">
                        <th scope="row" style="width: 10px;">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="checkAll" value="option1"
                                    [(ngModel)]="data.isSelected">
                            </div>
                        </th>
                        <td><a (click)="edit(data._id)" style="cursor: pointer;" class="fw-medium">#{{data.planId}}</a></td>
                        <td>{{data.name}}</td>
                        <td>{{data.member}}</td>
                        <td>{{data.partnerDiscount}}</td>
                        <td>{{data.amount}}</td>
                        <td><p  style="height: 100px; overflow: auto;" [innerHTML]="data.details"></p></td>
                        <td class="assignedto">{{data.validity}}</td>
                        <td class="status">
                            <div class="form-check form-switch form-switch-success form-switch-md" style="text-align: center;">
                                <input type="checkbox" [checked]="data.status == 'Active'" (click)="changeStatus(data,$event)" class="form-check-input">
                            </div>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-dang" (click)="delete(data._id)"><i class="ri-delete-bin-line"></i></a>
                        </td>
                    </tr>
                  </tbody>
                </table>
              </div>
          </div><!--end card-body-->
      </div><!--end card-->
  </div><!--end col-->
</div><!--end row-->
