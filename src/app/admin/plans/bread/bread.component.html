<app-breadcrumbs title="{{label}}" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="card">
    <div class="card-header">
        <i class="ri-arrow-go-back-fill" style="cursor:pointer; margin-right: 10px;"
            [routerLink]="['/admin/plans']"></i>
        <span class="card-title mb-0">{{label}}</span>
    </div><!-- end card header -->
    <div class="card-body">
        <div class="row">
            <div class="col-lg-12 border-right" >
                <div class="row">
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input [disabled]="action == 0" type="text" class="form-control" placeholder="Enter Name"
                                [(ngModel)]="name" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input [disabled]="action == 0" type="number" class="form-control"
                                placeholder="Enter Amount" [(ngModel)]="amount"
                                [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3" >
                        <div class="mb-3">
                            <label class="form-label">Validity</label>
                            <ng-select [disabled]="action == 0" [(ngModel)]="validity" [ngModelOptions]="{standalone: true}">
                                <ng-option value="30 Days" selected>30 Days</ng-option>
                                <ng-option value="90 Days" selected>90 Days</ng-option>
                                <ng-option value="180 Days" selected>180 Days</ng-option>
                                <ng-option value="360 Days" selected>360 Days</ng-option>
                            </ng-select>
                        </div>
                    </div>
                    <div class="col-lg-3" >
                        <div class="mb-3">
                            <label class="form-label">Member Count</label>
                            <input [disabled]="action == 0" type="number" class="form-control" placeholder="Enter Member Count" [(ngModel)]="member"
                                [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-3" >
                        <div class="mb-3">
                            <label class="form-label">Partner Discount</label>
                            <input [disabled]="action == 0" type="number" class="form-control" placeholder="Enter Partner Discount" [(ngModel)]="partnerDiscount"
                                [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="col-lg-9">
                        <div class="mb-3">
                            <label class="form-label">Details</label>
                            <ckeditor [editor]="Editor" #activeWallEditor [config]="config" [(ngModel)]="details">
                            </ckeditor>
                            <!-- <textarea [disabled]="action == 0" type="text" class="form-control" placeholder="Enter Details"
                                [(ngModel)]="details" [ngModelOptions]="{standalone: true}"></textarea> -->
                        </div>
                    </div>
                   
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer" *ngIf="action !== 0">
        <button type="button" style="float: right;" class="btn btn-primary waves-effect waves-light" (click)="submit()"
            [disabled]="loader">{{label}} <i class="fa fa-circle-o-notch fa-spin" *ngIf="loader"
                style="margin-left: 10px;"></i></button>
    </div>
</div>
