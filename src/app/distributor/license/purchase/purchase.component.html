<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Purchase License" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row justify-content-center">
  <div class="col-xxl-9">
      <div class="card">
          <form>
              <div class="card-body p-4">
                  <div class="table-responsive">
                      <table class="invoice-table table table-borderless table-nowrap mb-0">
                          <thead class="align-middle">
                              <tr class="table-active">
                                  <th scope="col" style="width: 50px;">#</th>
                                  <th scope="col">
                                      Plan
                                  </th>
                                  <th scope="col" style="width: 120px;">Quantity</th>
                                  <th scope="col" style="width: 120px;">
                                      <div class="d-flex currency-select input-light align-items-center">
                                          Rate
                                      </div>
                                  </th>
                                 
                                  <th scope="col" style="width: 120px;">Discount</th>
                                  <th scope="col" class="" style="width: 150px;">Amount</th>
                                  <th scope="col" class="text-end" style="width: 105px;"></th>
                              </tr>
                          </thead>
                          <tbody id="newlink">
                              <tr *ngFor="let item of items;let i =index" id="{{i+1}}" class="product">
                                  <th scope="row" class="product-id">{{i+1}}</th>
                                  <td class="text-start">
                                      <div class="mb-2">
                                        <ng-select [(ngModel)]="item.plan" (change)="planSelect($event,i)" [ngModelOptions]="{standalone: true}">
                                            <ng-option *ngFor="let data of plans" value="{{data._id}}">
                                              {{data.name}}
                                            </ng-option>
                                        </ng-select>
                                      </div>
                                  </td>
                                  <td>
                                    <input type="number" class="form-control product-price bg-light border-0" placeholder="0"  (keyup)="increment(i)" required [(ngModel)]="item.quantity" [ngModelOptions]="{standalone: true}"/>
                                </td>
                                  <td>
                                      <input type="number" class="form-control product-price bg-light border-0" placeholder="0.00" readonly  [(ngModel)]="item.rate" [ngModelOptions]="{standalone: true}"/>
                                  </td>
                                  <td>
                                    <input type="number" class="form-control product-price bg-light border-0" placeholder="0.00" readonly  [(ngModel)]="item.discount" [ngModelOptions]="{standalone: true}"/>
                                </td>
                                  <td class="text-end">
                                      <div>
                                          <input type="text" class="form-control bg-light border-0 product-line-price" placeholder="0.00" [(ngModel)]="item.amount" [ngModelOptions]="{standalone: true}" readonly />
                                      </div>
                                  </td>
                                  <td class="product-removal">
                                      <a (click)="delete(i)" class="btn btn-success">Delete</a>
                                  </td>
                              </tr>
                          </tbody>
                          <tr id="newForm" style="display: none;"></tr>
                          <tr>
                              <td colspan="9">
                                  <a class="btn btn-soft-secondary fw-medium" (click)="add()"><i class="ri-add-fill me-1 align-bottom"></i> Add Item</a>
                              </td>
                          </tr>
                          <tr class="border-top border-top-dashed mt-2">
                            <td colspan="4"></td>
                            <td colspan="3" class="p-0">
                                <table class="table table-borderless table-sm table-nowrap align-middle mb-0">
                                    <tbody>
                                        <tr class="border-top border-top-dashed">
                                            <th scope="row">Total Amount</th>
                                            <td>
                                                <input type="text" class="form-control bg-light border-0" placeholder="0.00" [(ngModel)]="totalAmount" [ngModelOptions]="{standalone: true}" readonly />
                                            </td>
                                        </tr>
                                    </tbody>
                                </table><!--end table-->
                            </td>
                        </tr>
                      </table><!--end table-->
                  </div>
                  <div class="hstack gap-2 justify-content-end d-print-none mt-4">
                      <button  class="btn btn-success" (click)="save()"><i class="ri-shopping-cart-2-line align-bottom me-1" ></i> Purchase</button>
                  </div>
              </div>
          </form>
      </div>
  </div><!--end col-->
</div><!--end row-->
