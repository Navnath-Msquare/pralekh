<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Licenses List" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row">
  <div class="col-lg-12">
      <div class="card"  id="tasksList">
          <div class="card-header border-0">
              <div class="d-flex align-items-center">
                  <h5 class="card-title mb-0 flex-grow-1">All Licenses</h5>
                  <div class="flex-shrink-0">
                      
                  </div>
              </div>
          </div>
          <div class="card-body bg-soft-light border border-dashed border-start-0 border-end-0">
            <form>
                <div class="row g-3">
                    <div class="col-xxl-5 col-sm-6">
                        <div class="search-box">
                            <input type="text"  name="searchTerm" class="form-control search bg-light border-light" placeholder="Search..." [(ngModel)]="searchTerm">
                            <i class="ri-search-line search-icon"></i>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-7 col-sm-6 text-end">
                        <button class="btn btn-danger add-btn" [routerLink]="['/distributor/license/purchase']"><i class="ri-add-line align-bottom me-1"></i> Purchase License</button>
                    </div>
                </div>
                <!--end row-->
            </form>
        </div>
        <div class="card-body"  style="padding-top: 0.6rem;">
              <div class="table-responsive table-card mb-2">
                <table class="table" #table>
                  <thead>
                  <tr class="bg-light text-muted">
                    <th scope="col" style="width: 10px;">
                      <div class="form-check">
                          <input class="form-check-input" type="checkbox" id="checkAll" value="option">
                      </div>
                  </th>
                  <th class="sort" sortable="project">License Key</th>
                  <th class="sort" sortable="project">Plan Name</th>
                  <th class="sort" sortable="project">User Name</th>
                  <th class="sort" sortable="project">Date</th>
                  <th class="sort" sortable="task">Status</th>
                  </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let data of data |filter:searchTerm | filter:statusTerm;let i =index">
                        <th scope="row" style="width: 10px;">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="checkAll" value="option1"
                                    [(ngModel)]="data.isSelected">
                            </div>
                        </th>
                        <td><a (click)="edit(data._id)" style="cursor: pointer;" class="fw-medium">{{data.key}}</a></td>
                        <td>{{(data.planId == undefined)?'-':data.planId?.name}}</td>
                        <td>{{(data.subscriptionId == undefined)?'-':data.subscriptionId?.userId?.name}}</td>
                        <td>{{data.createdAt | date:'dd MMM, yyyy'}}</td>
                        <td>
                            <div class="badge badge-soft-warning " *ngIf="data.status == 'Not Used'">{{data.status}}</div>
                            <div class="badge badge-soft-success " *ngIf="data.status == 'Used'">{{data.status}}</div>
                        </td>
                    </tr>
                  </tbody>
                </table>
              </div>
          </div><!--end card-body-->
      </div><!--end card-->
  </div><!--end col-->
</div><!--end row-->
