<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Service Package List" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row">
  <div class="col-lg-12">
    <div class="card" *ngIf="create">
      <div class="card-header">
        <!-- <i class="ri-arrow-go-back-fill" style="cursor:pointer; margin-right: 10px;"
                [routerLink]="['/admin/distributors']"></i> -->
        <span class="card-title mb-0" *ngIf="!editS">Create Service Package</span>
        <span class="card-title mb-0" *ngIf="editS">Edit Service Package</span>
      </div><!-- end card header -->
      <div class="card-body">
        <div class="row">
          <div class="col-lg-12 border-right">
            <div class="row">
              <div class="col-lg-3">
                <div class="mb-3">
                  <label class="form-label">Name</label>
                  <input type="text" class="form-control" placeholder="Enter Name" [(ngModel)]="name"
                    [ngModelOptions]="{standalone: true}">
                </div>
              </div>
              <div class="col-lg-3">
                <div class="mb-3">
                  <label class="form-label">Description</label>
                  <input type="text" class="form-control" placeholder="Enter Description" [(ngModel)]="desc"
                    [ngModelOptions]="{standalone: true}">
                </div>
              </div>
              <div class="col-lg-3">
                <div class="mb-3">
                  <label class="form-label">Member Cost</label>
                  <input type="number" class="form-control" placeholder="Enter Member Cost" [(ngModel)]="cost"
                    [ngModelOptions]="{standalone: true}">
                </div>
              </div>
              <div class="col-lg-3">
                <div class="mb-3">
                  <label class="form-label">Non-Member Cost</label>
                  <input type="number" class="form-control" placeholder="Enter Non-Member Cost" [(ngModel)]="nonMemberCost"
                    [ngModelOptions]="{standalone: true}">
                </div>
              </div>
              <div class="col-lg-3">
                <div class="mb-3">
                  <label class="form-label">Documents</label>
                  <div class="input-group">
                    <input type="text" class="form-control" placeholder="Enter Document Name" [(ngModel)]="documentName"
                    [ngModelOptions]="{standalone: true}">
                    <button type="button" class="btn btn-primary" (click)="addDocuments()"><i class="ri-add-line"></i></button>
                  </div>
                    <div class="mt-2" *ngFor="let item of documents;let i =index">{{i+1}}. {{item.name}}  <i class="cursor-pointer ri-delete-bin-line ms-2 text-danger align-bottom" (click)="deleteDocuments(i)"></i></div>
                 
                </div>
              </div>
              <div class="col-lg-3">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" id="formCheck1" [(ngModel)]="pickup">
                  <label class="form-check-label" for="formCheck1">
                  Required Pickup / Drop
                  </label>
                  </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button type="button" style="float: right; margin-left: 10px;" class="btn btn-light waves-effect waves-light"
          (click)="clearFilter()">Close </button>

        <button type="button" style="float: right;" class="btn btn-primary waves-effect waves-light" (click)="submit()"
          [disabled]="submitLoader" *ngIf="!editS">Create Service Package <i class="fa fa-circle-o-notch fa-spin"
            *ngIf="submitLoader" style="margin-left: 10px;"></i></button>
        <button type="button" style="float: right;" class="btn btn-primary waves-effect waves-light" (click)="submit()"
          [disabled]="submitLoader" *ngIf="editS">Edit Service Package <i class="fa fa-circle-o-notch fa-spin"
            *ngIf="submitLoader" style="margin-left: 10px;"></i></button>

      </div>
    </div>
    <div class="card" id="tasksList">
      <div class="card-header border-0">
        <div class="d-flex align-items-center">
          <h5 class="card-title mb-0 flex-grow-1"><i class="ri-arrow-go-back-line" [routerLink]="['/distributor/service/private']"></i>All Service Packages</h5>
          <div class="flex-shrink-0">

          </div>
        </div>
      </div>
      <div class="card-body bg-soft-light border border-dashed border-start-0 border-end-0">
        <form>
          <div class="row g-3">
            <div class="col-xxl-5 col-sm-12">
              <div class="search-box">
                <input type="text" name="searchTerm" class="form-control search bg-light border-light"
                  placeholder="Search..." [(ngModel)]="searchTerm">
                <i class="ri-search-line search-icon"></i>
              </div>
            </div>
            <!--end col-->
            <div class="col-xxl-2 col-sm-6">
              <!-- <div class="input-light">
                <select class="form-control bg-light border-light" data-choices data-choices-search-false
                  name="choices-single-default" id="idStatus" [(ngModel)]="statusTerm">
                  <option value="" selected>All</option>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div> -->
            </div>
            <div class="col-xxl-5 col-sm-6 text-end">
              <!-- <button class="btn btn-danger add-btn" (click)="create =true;"><i
                  class="ri-add-line align-bottom me-1"></i> Create Service Package</button> -->
            </div>
          </div>
          <!--end row-->
        </form>
      </div>
      <div class="card-body" style="padding-top: 0.6rem;">
        <div class="table-responsive table-card mb-2">
          <table class="table" #table>
            <thead>
              <tr class="bg-light text-muted">
                <th scope="col" style="width: 10px;">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkAll" value="option">
                  </div>
                </th>
                <th class="sort" style="width: 50px;" sortable="taskId">Sr. No.</th>
                <th>Package Name</th>
                <th>Member Cost</th>
                <th>Non-Member Cost</th>
                <th>Description</th>
                <th>Document</th>
                <th>Pickup/Drop</th>
                <!-- <th>Action</th> -->
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of data |filter:searchTerm | filter:statusTerm;let i =index">
                <th scope="row" style="width: 10px;">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="checkAll" value="option1"
                      [(ngModel)]="data.isSelected">
                  </div>
                </th>
                <td style="width: 50px;"><a style="cursor: pointer;" class="fw-medium">#{{i+1}}</a>
                </td>
                <td>{{data.name}}</td>
                <td>Rs. {{data.cost}}</td>
                <td>Rs. {{data.nonMemberCost}}</td>
                <td>{{data.description}}</td>
                <td><div class="mt-1" *ngFor="let item of data.documents;let i =index">{{i+1}}. {{item.name}}</div></td>
                <td><span *ngIf="data.pickup">Yes</span><span *ngIf="!data.pickup">No</span></td>
                <!-- <td><a class="btn btn-sm btn-dang" (click)="delete(data._id)"><i class="ri-delete-bin-line"></i></a></td> -->
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!--end card-body-->
    </div>
    <!--end card-->
  </div>
  <!--end col-->
</div>
<!--end row-->
